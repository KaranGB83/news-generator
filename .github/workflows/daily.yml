name: Daily news run

# The pipeline runs right here on the GitHub runner, not on Render: kbNews sits behind Cloudflare,
# which sometimes challenges requests coming from Render's shared addresses but lets GitHub's through
# (see "Check kbNews reachability"). Render is not needed for this job.
on:
  schedule:
    # GitHub cron runs in UTC. Three attempts a day: the pipeline only does what is still missing,
    # so later runs do nothing once all three categories are published.
    - cron: "30 1 * * *" # 07:00 IST
    - cron: "30 5 * * *" # 11:00 IST
    - cron: "30 9 * * *" # 15:00 IST
  workflow_dispatch:
    inputs:
      categories:
        description: "Optional subset, e.g. world,india (empty = all three)"
        required: false
        default: ""

# Never two runs at once (the app also refuses overlapping runs).
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          KBNEWS_BASE_URL: ${{ vars.KBNEWS_BASE_URL || 'https://kbnews.onrender.com' }}
          KBNEWS_BOT_EMAIL: ${{ secrets.KBNEWS_BOT_EMAIL }}
          KBNEWS_BOT_PASSWORD: ${{ secrets.KBNEWS_BOT_PASSWORD }}
          CATEGORIES: ${{ github.event.inputs.categories }}
        run: |
          args=(run --source "github-${{ github.event_name }}")
          if [ -n "$CATEGORIES" ]; then args+=(--categories "$CATEGORIES"); fi
          python -m app.cli "${args[@]}"
