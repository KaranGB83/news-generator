name: Daily news run

on:
  schedule:
    # GitHub cron runs in UTC. Three attempts a day: the pipeline only retries what has not been
    # posted yet, so later runs do nothing once all three categories are published. They exist
    # because kbNews's proxy sometimes blocks a run (Cloudflare challenge) and a later one gets through.
    - cron: "30 1 * * *" # 07:00 IST
    - cron: "30 5 * * *" # 11:00 IST
    - cron: "30 9 * * *" # 15:00 IST
  workflow_dispatch: # manual "Run workflow" button

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger news generation
        env:
          APP_URL: ${{ secrets.APP_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          # Retries cover Render's free-tier cold start (first request can 502/503 or time out).
          curl --fail-with-body --silent --show-error \
            --max-time 600 \
            --retry 5 --retry-delay 30 --retry-max-time 300 --retry-connrefused \
            -X POST "${APP_URL%/}/jobs/run?source=github-actions" \
            -H "X-API-Key: $API_KEY"
