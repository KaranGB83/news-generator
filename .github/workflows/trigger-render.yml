name: Trigger run on Render (manual)

# Manual only. The scheduled run happens inside GitHub Actions (daily.yml) because Cloudflare
# sometimes challenges requests from Render to kbNews. Kept for testing the Render deployment.
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger news generation
        env:
          APP_URL: ${{ secrets.APP_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          # Retries cover Render's free-tier cold start (first request can 502/503 or time out).
          curl --fail-with-body --silent --show-error \
            --max-time 600 \
            --retry 5 --retry-delay 30 --retry-max-time 300 --retry-connrefused \
            -X POST "${APP_URL%/}/jobs/run?source=github-actions" \
            -H "X-API-Key: $API_KEY"
